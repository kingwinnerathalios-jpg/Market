{% extends "base.html" %}
{% block content %}
<div class="detail">
  <img src="{{ product.image_url }}" alt="{{ product.name }}">
  <div><p class="eyebrow">{{ product.category }}</p><h1>{{ product.name }}</h1><p>{{ product.description }}</p>
  <h2>{{ product.price_cents|money }} €</h2><p class="muted">{{ product.stock }} auf Lager</p>
  <form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}"><button class="button" {% if product.stock == 0 %}disabled{% endif %}>In den Warenkorb</button></form>
  <p><a href="{{ url_for('index') }}">← Zurück zum Shop</a></p></div>
</div>
{% endblock %}
